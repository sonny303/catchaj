name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Security & Pipeline Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Syntax
        run: |
          python -m py_compile *.py scripts/*.py examples/*.py

      - name: Run Pre-Commit Security & PII Scanner Self-Tests
        run: |
          python scripts/pre_commit_scan.py --test

      - name: Run Pre-Commit Security Scan on All Tracked Files
        run: |
          python scripts/pre_commit_scan.py $(git ls-files)

      - name: Execute Offline Synthetic Dry Run
        run: |
          python examples/run_synthetic_dry_run.py
